services:
  postgres:
    image: postgres:15-alpine
    container_name: branchview-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-branchview}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-branchview}"]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - branchview-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: branchview-backend
    restart: always
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-branchview}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-branchview}
      SECRET_KEY: ${SECRET_KEY:-branchview_super_secret_jwt_key_change_in_production_2026}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - branchview-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: branchview-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - branchview-network

volumes:
  pgdata:

networks:
  branchview-network:
    driver: bridge
